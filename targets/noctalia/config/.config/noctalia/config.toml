# Settings for all machines. post.sh links machine.toml to the file for this
# machine in machines/. Noctalia merges every *.toml in this directory, and does
# not read subdirectories, so only the linked machine file loads.
#
# The Settings window writes to ~/.local/state/noctalia/settings.toml, which
# wins over this file.

[shell]
launch_apps_as_systemd_services = true # or a service restart kills the apps

[wallpaper]
directory = "~/wallpapers"

[wallpaper.default]
path = "~/wallpapers/still_life_with_star_wars_motif.png"

[weather]
enabled = true

# The network and bluetooth widgets show the same state. The applets keep
# running, because nm-applet answers password requests for VPN and 802.1X.
[widget.tray]
hidden = ["nm-applet", "blueman"]

[bar.main]
position = "top"
margin_ends = 10 # the default of 180 hides the tray on a laptop panel
start = ["workspaces", "active_window"]
center = ["media"]
end = [
  "tray",
  "clipboard",
  "wallpaper",
  "volume",
  "network",
  "bluetooth",
  "brightness",
  "battery",
  "clock",
  "weather",
  "notifications",
  "control-center",
  "session",
]
